  tags: [langgraph, agent]
  week: week12-AGENT
  project: ticket-diagnose-agent
  stack: agent
  variants:
    - LangGraph 的状态（state）是怎么在节点间传递的？
    - 五节点流程里并行派发节点做了什么？
