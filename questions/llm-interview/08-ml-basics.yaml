- id: ml-009
  difficulty: medium
  type: boolean
  question: 如果不加任何激活函数，无论叠加多少层全连接层，整个网络仍然等价于一个线性变换。
  answer: true
  explanation: 多层线性层连乘 W₃(W₂(W₁x+b₁)+b₂)+b₃ 可以合并为单个线性变换 Wx+b，表达能力不变——多层线性=仍线性。激活函数（ReLU 等）引入非线性，深度才有意义；课程强调深度比宽度更重要，正是建立在非线性激活之上。
  tags: [activation, mlp]
  week: week2-深度学习基础
  project: none
  stack: transformer
  variants:
