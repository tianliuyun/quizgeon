  type: open
  question: 请比较 PPO、DPO、GRPO 三种对齐方法的核心区别，说明各自的优缺点和适用场景。
  answer:
  - PPO需要四个模型 Actor Critic RM Reference
  - DPO把奖励模型隐式消解在损失函数里
  - GRPO用组内相对奖励代替Critic
  - PPO最复杂显存最大但可以在线探索
  - DPO最简单稳定但受限于离线数据
  - GRPO省显存适合可验证奖励如数学代码
  - KL散度惩罚防止模型跑偏
  explanation: PPO：4个模型，显式RL循环，可在线探索但复杂不稳定；DPO：直接偏好优化，奖励模型隐式消解，简单稳定但离线；GRPO：组相对策略优化，用组内平均奖励代替Critic，省显存，适合可验证奖励任务。
  tags:
